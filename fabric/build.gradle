evaluationDependsOn(":")

apply plugin: 'fabric-loom'
apply plugin: 'com.gradleup.shadow'
apply plugin: 'com.modrinth.minotaur'
apply plugin: 'io.github.themrmilchmann.curseforge-publish'

def fabricSources = rootProject.file('fabric/src/main')

sourceSets.main {
	java.setSrcDirs([new File(fabricSources, 'java')])
	resources.setSrcDirs([new File(fabricSources, 'resources')])
}

base {
    archivesName = project.archives_base_name + "-fabric"
}
group = project.maven_group + ".fabric"

configurations {
	shadowInclude
}

repositories {
	maven { url 'https://repo.codemc.io/repository/relativitymc/' }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	shadowInclude implementation(project(":common"))

	// Fabric API. This is technically optional, but you probably want it anyway.
//	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft", '>=1.18 <26'
	inputs.property "java", '>=17'
	inputs.property "loader", '>=0.15.2'

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft": inputs.properties.minecraft,
				"java": inputs.properties.java,
				"loader": inputs.properties.loader
	}
}

def packetNames = tasks.register('generatePacketNames') {
	def packetSource = new File(fabricSources, 'java/com/ishland/raknetify/fabric/common/connection/RakNetMultiChannel.java')
	def output = layout.buildDirectory.file('generated/packetNames/raknetify-packet-names.properties')
	inputs.file(packetSource)
	inputs.file(provider { loom.mappingConfiguration.tinyMappings.toFile() })
	outputs.file(output)
	doLast {
		def classes = (packetSource.text =~ 'net/minecraft/class_[0-9_]+(?:\\$class_[0-9_]+)*').collect().toSet()
		def names = new TreeMap<String, Set<String>>()
		def mappingFiles = [loom.mappingConfiguration.tinyMappings.toFile()]
		mappingFiles.each { mappingFile ->
			mappingFile.eachLine('UTF-8') { line ->
				def fields = line.split('\t')
				if (fields[0] == 'c' && classes.contains(fields[2])) {
					def key = fields[2].replace('/', '.')
					if (!names.containsKey(key)) names[key] = new TreeSet<String>()
					names[key].add(fields[1].replace('/', '.'))
				}
			}
		}
		output.get().asFile.with { parentFile.mkdirs() }
		output.get().asFile.setText(names.collect { key, value -> "$key=${value.join(',')}\n" }.join(), 'UTF-8')
	}
}

processResources {
	from(packetNames)
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

loom {
	accessWidenerPath = new File(fabricSources, 'resources/raknetify-fabric.accesswidener')
	runs {
		server {
			vmArgs "-Draknetify.debug=true", "-Dio.netty.leakDetection.level=advanced"
			ideConfigGenerated(true)
		}
		client {
			vmArgs "-Draknetify.debug=true", "-Dio.netty.leakDetection.level=advanced"
			ideConfigGenerated(true)
		}
	}
    mixin {
        useLegacyMixinAp = true
    }
}

jar {
	exclude "META-INF/LICENSE.txt"
	exclude "META-INF/NOTICE.txt"
	from "../LICENSE"
}

shadowJar {
	dependencies {
		exclude(dependency('it.unimi.dsi:fastutil'))
	}
	exclude "META-INF/LICENSE.txt"
	exclude "META-INF/NOTICE.txt"
	minimize()
	archiveClassifier = "all-dev"
	configurations = [ project.configurations.shadowInclude ]
	from "../LICENSE"
}

//noinspection UnnecessaryQualifiedReference
task("remapShadowJar", type: rootProject.remapJarTaskType, dependsOn: shadowJar) {
	input = shadowJar.archiveFile
	archiveFileName = shadowJar.archiveFileName.get().replaceAll("-dev\\.jar\$", ".jar")
	addNestedDependencies = true
}

assemble.dependsOn(remapShadowJar)

afterEvaluate {
	migrateMappings.configure {
		outputDir = project.file("build/remappedSrc")
		doLast {
			copy {
				from project.file("build/remappedSrc")
				into project.file("src/main/java")
			}
		}
	}
}

tasks.withType(AbstractArchiveTask) {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

modrinth {
	versionNumber = project.version
	versionName = project.version + " devbuild"
	uploadFile = remapShadowJar
	loaders = ["fabric", "quilt"]
}

curseforge {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    publications {
        register("main") {
            projectId = "631457"

            gameVersion("minecraft-1-18", "1-18")
            gameVersion("minecraft-1-18", "1-18-1")
            gameVersion("minecraft-1-18", "1-18-2")
            gameVersion("minecraft-1-19", "1-19")
            gameVersion("minecraft-1-19", "1-19-1")
            gameVersion("minecraft-1-19", "1-19-2")
            gameVersion("minecraft-1-19", "1-19-3")
            gameVersion("minecraft-1-19", "1-19-4")
            gameVersion("minecraft-1-20", "1-20")
            gameVersion("minecraft-1-20", "1-20-1")
            gameVersion("minecraft-1-20", "1-20-2")
            gameVersion("minecraft-1-20", "1-20-3")
            gameVersion("minecraft-1-20", "1-20-4")
            gameVersion("minecraft-1-20", "1-20-5")
            gameVersion("minecraft-1-20", "1-20-6")
            gameVersion("minecraft-1-21", "1-21")
            gameVersion("minecraft-1-21", "1-21-1")
            gameVersion("minecraft-1-21", "1-21-2")
            gameVersion("minecraft-1-21", "1-21-3")
            gameVersion("minecraft-1-21", "1-21-4")
            gameVersion("minecraft-1-21", "1-21-5")
            gameVersion("minecraft-1-21", "1-21-6")
            gameVersion("minecraft-1-21", "1-21-7")
            gameVersion("minecraft-1-21", "1-21-8")
            gameVersion("minecraft-1-21", "1-21-9")
            gameVersion("minecraft-1-21", "1-21-10")
            gameVersion("minecraft-1-21", "1-21-11")
            gameVersion("java", "java-22")
            gameVersion("java", "java-21")
            gameVersion("java", "java-20")
            gameVersion("java", "java-19")
            gameVersion("java", "java-18")
            gameVersion("java", "java-17")
            gameVersion("modloader", "fabric")
            gameVersion("environment", "server")
            gameVersion("environment", "client")

            artifacts.register("main") {
                from(remapShadowJar)

                displayName = project.version + " devbuild"
                releaseType = rootProject.curseforgeAlpha

                changelog {
                    format = rootProject.curseforgeMarkdown
                    from(com.ishland.buildscript.ParseGItHubActionChangelog.getChangelog())
                }
            }
        }
    }
}
