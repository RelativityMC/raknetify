apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'com.gradleup.shadow'
apply plugin: 'com.modrinth.minotaur'
apply plugin: 'io.github.themrmilchmann.curseforge-publish'

base {
    archivesName = project.archives_base_name + '-fabric-26'
}

group = project.maven_group + ".fabric"

configurations {
    shadowInclude
}

dependencies {
    minecraft "com.mojang:minecraft:${project.modern_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    shadowInclude implementation(project(':common'))
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', '>=26.1 <=26.3'
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft: inputs.properties.minecraft,
                loader: '>=0.19.5', java: '>=25'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

loom {
    accessWidenerPath = file('src/main/resources/raknetify-fabric.accesswidener')
}

shadowJar {
    dependencies {
        exclude(dependency('it.unimi.dsi:fastutil'))
    }
    exclude 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt'
    minimize()
    archiveClassifier = 'all'
    configurations = [project.configurations.shadowInclude]
    from '../LICENSE'
}

assemble.dependsOn(shadowJar)

jar {
    from "../LICENSE"
}

modrinth {
	versionNumber = project.version
	versionName = project.version + " devbuild"
	uploadFile = shadowJar
	loaders = ["fabric", "quilt"]
}

curseforge {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    publications {
        register("main") {
            projectId = "631457"

            gameVersion("minecraft-26-1", "26-1")
            gameVersion("minecraft-26-1", "26-1-1")
            gameVersion("minecraft-26-1", "26-1-2")
            gameVersion("minecraft-26-2", "26-2")
            gameVersion("minecraft-26-3", "26-3")
            gameVersion("java", "java-25")
            gameVersion("modloader", "fabric")
            gameVersion("environment", "server")
            gameVersion("environment", "client")

            artifacts.register("main") {
                from(shadowJar)

                displayName = project.version + " devbuild"
                releaseType = rootProject.curseforgeAlpha

                changelog {
                    format = rootProject.curseforgeMarkdown
                    from(com.ishland.buildscript.ParseGItHubActionChangelog.getChangelog())
                }
            }
        }
    }
}
